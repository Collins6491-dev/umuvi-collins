{% extends 'dashboard/base.html' %}
{% block title %}{{ form_title }} — Dashboard{% endblock %}
{% block dashboard_content %}
<div class="form-heading"><a class="back-link" href="{% url 'dashboard:overview' %}">← Dashboard</a><p class="eyebrow">Content management</p><h1>{{ form_title }}</h1></div>
<form method="post" enctype="multipart/form-data" class="dashboard-form" novalidate data-loading-form>{% csrf_token %}{% include 'components/form_fields.html' with form=form %}<div class="form-actions"><button class="button" type="submit" data-loading-text="Saving changes…" data-uploading-text="Uploading…">Save changes</button><a class="text-link" href="{% url 'dashboard:overview' %}">Cancel</a></div></form>
{% endblock %}
